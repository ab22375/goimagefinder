<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoImageFinder</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GoImageFinder</h1>
        </header>

        <div class="main-content">
            <div class="left-panel">
                <div class="config-section">
                    <h2>Database Configuration</h2>
                    <div class="input-group">
                        <input type="text" id="dbPath" placeholder="/path/to/database.db" value="{{.DatabasePath}}">
                        <button class="browse-btn" onclick="browsePath('db')">...</button>
                    </div>
                    <div class="db-info" id="dbInfo"></div>
                </div>

                <div class="config-section">
                    <h2>Scan Images</h2>
                    <div class="input-group">
                        <input type="text" id="folderPath" placeholder="/path/to/images/" value="{{.FolderPath}}">
                        <button class="browse-btn" onclick="browsePath('folder')">...</button>
                    </div>
                    
                    <div class="scan-options">
                        <div class="option-group">
                            <label for="prefix">Source Prefix:</label>
                            <input type="text" id="prefix" placeholder="Optional prefix" value="{{.Prefix}}">
                        </div>
                        
                        <div class="option-group">
                            <label>
                                <input type="checkbox" id="forceRewrite" {{if .ForceRewrite}}checked{{end}}>
                                Force Rewrite
                            </label>
                        </div>
                    </div>
                    
                    <button class="scan-btn" onclick="startScan()">Scan</button>
                </div>

                <div class="search-section">
                    <h2>Search Similar Images</h2>
                    <div class="file-selector">
                        <input type="file" id="imageFile" accept="image/*" multiple style="display: none" onchange="handleFileSelect(event)">
                        <div class="select-actions">
                            <button class="select-btn" onclick="document.getElementById('imageFile').click()">Select Images</button>
                            <button class="clear-btn" onclick="clearSelectedImages()" style="display: none" id="clearBtn">Clear All</button>
                        </div>
                        <div id="selectedImagesInfo" class="selected-images-info"></div>
                        <div id="selectedImages" class="selected-images-grid"></div>
                    </div>

                    <div class="threshold-control">
                        <label>Threshold:</label>
                        <div class="slider-container">
                            <input type="range" id="threshold" min="0" max="100" value="{{mul .Threshold 100}}" oninput="updateThreshold()">
                            <span id="thresholdValue">{{.Threshold}}</span>
                        </div>
                    </div>

                    <button class="search-btn" id="searchBtn" onclick="searchImages()">Search</button>
                </div>

                <div id="progressBar" class="progress-bar" style="display: none;">
                    <div class="progress-fill"></div>
                    <span class="progress-text"></span>
                </div>
            </div>

            <div class="right-panel">
                <h2>Results</h2>
                <div class="results-header">
                    <span class="col-preview">Preview</span>
                    <span class="col-path">Path</span>
                    <span class="col-score">Score</span>
                    <span class="col-actions">Actions</span>
                </div>
                <div id="results" class="results-container">
                    <!-- Results will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
