version: '3.8'

services:
  goimagefinder:
    image: ab22375/goimagefinder
    # Or build locally:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: goimagefinder
    ports:
      - "${PORT:-8012}:8012"
    volumes:
      # Persistent database storage
      - goimagefinder_data:/data
      # Mount your photo directories - add as many as you need
      # The container path names will appear in the web UI for selection
      - /Users/z/Downloads/media:/photos:ro
      # - /Volumes/ExternalSSD:/external:ro
      # - /Volumes/Backup:/backup:ro
    environment:
      - TZ=${TZ:-UTC}
      # List all mounted photo paths (comma-separated) for browsing in web UI
      - GOIMAGEFINDER_BROWSE_ROOTS=/photos
      # Add more roots when you mount more volumes:
      # - GOIMAGEFINDER_BROWSE_ROOTS=/photos,/external,/backup
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  goimagefinder_data:
    driver: local

# =============================================================================
# USAGE EXAMPLES
# =============================================================================
#
# BASIC - Start with single photo folder:
#   docker-compose up -d
#
# VIEW LOGS:
#   docker-compose logs -f
#
# STOP:
#   docker-compose down
#
# CUSTOM PORT:
#   PORT=9000 docker-compose up -d
#
# -----------------------------------------------------------------------------
# MULTIPLE PHOTO FOLDERS EXAMPLE:
# -----------------------------------------------------------------------------
# To scan photos from multiple locations (e.g., internal drive + external SSD):
#
# 1. Add volume mounts for each location:
#      volumes:
#        - goimagefinder_data:/data
#        - /Users/me/Pictures:/photos:ro
#        - /Volumes/ExternalSSD/Photos:/external:ro
#        - /Volumes/Backup/Photos:/backup:ro
#
# 2. Set GOIMAGEFINDER_BROWSE_ROOTS to list all paths:
#      environment:
#        - GOIMAGEFINDER_BROWSE_ROOTS=/photos,/external,/backup
#
# 3. Restart: docker-compose up -d
#
# The web UI will show all roots as options to browse and scan.
# =============================================================================
